name: Flask CI/CD Pipeline to Docker Hub - v1

on:
    push:
        branches:
          - main
        # paths:
        #   - './03-ci-cd-pipeline-with-docker/**'

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:

            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'

            - name: Install Dependencies
              run: pip install -r requirements.txt
              working-directory: ./03-ci-cd-pipeline-with-docker
            
            - name: Run Tests
              env:
                APP_SETTINGS: config.TestingConfig
                DATABASE_URL: sqlite:///test.db
                SECRET_KEY: test_secret_key
              run: |
                pytest
              working-directory: ./03-ci-cd-pipeline-with-docker

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name: Define Image tag
              id: meta
              run: echo "TAG=${{ secrets.DOCKER_USERNAME }}/${GITHUB_REPOSITORY#*/}:${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
            
            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                context: ./03-ci-cd-pipeline-with-docker
                push: true
                build-args: |
                  APP_SETTINGS=config.ProductionConfig
                  DATABASE_URL=${{ secrets.DATABASE_URL }}
                  SECRET_KEY=${{ secrets.SECRET_KEY }}
                tags: ${{ steps.meta.outputs.TAG }}